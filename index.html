<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Juego en español para practicar pandas, gráficos, modelos e hipótesis en 12 retos.">
  <title>Detectives de datos</title>
  <link rel="stylesheet" href="juego.css">
</head>
<body>
<main id="detectives-de-datos" aria-labelledby="dd-title">
  <header class="dd-header">
    <h1 id="dd-title"><span aria-hidden="true">⌕</span> Detectives de datos</h1>
    <div class="dd-progress-group">
      <p id="dd-count" class="tabular-nums"></p>
      <div class="progress" role="progressbar" aria-label="Retos resueltos" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-bar" id="dd-progress" style="width:0%"></div></div>
    </div>
  </header>
  <noscript>Activa JavaScript para jugar.</noscript>
  <div class="dd-layout">
  <aside class="dd-sidebar" aria-label="Temas y progreso">
    <figure class="dd-illustration" id="dd-illustration" data-scene="0" aria-hidden="true"></figure>
    <h2>Tu recorrido</h2>
    <ol id="dd-route"></ol>
  </aside>
  <div id="dd-round">
    <div class="dd-problem" aria-live="polite">
      <p id="dd-unit"></p>
      <h2 id="dd-question" tabindex="-1"></h2>
      <p id="dd-instruction"></p>
    </div>
    <div id="dd-evidence"></div>
    <div id="dd-chart" hidden data-viz-composition>
      <figure><figcaption id="dd-chart-title"></figcaption><canvas id="dd-canvas" role="img" aria-describedby="dd-chart-title"></canvas></figure>
      <details id="dd-chart-data"><summary>Ver los datos del gráfico</summary><div></div></details>
    </div>
    <div id="dd-choices" class="dd-choices" role="group" aria-labelledby="dd-question"></div>
    <div id="dd-order" hidden><p>Tu orden</p><ol></ol></div>
    <div class="viz-row dd-actions">
      <button type="button" class="btn btn-primary" id="dd-check" disabled>Comprobar</button>
      <button type="button" class="btn btn-ghost" id="dd-hint">Ver pista</button>
      <button type="button" class="btn btn-ghost" id="dd-undo" hidden>Deshacer paso</button>
    </div>
    <p id="dd-clue" role="status" hidden></p>
    <div id="dd-feedback" aria-live="polite"></div>
    <figure id="dd-explanation" hidden><figcaption>Así se resuelve</figcaption><ol></ol></figure>
    <button type="button" class="btn btn-primary" id="dd-next" hidden>Siguiente reto</button>
  </div>
  </div>
  <div id="dd-finish" hidden>
    <h2 id="dd-result-title" aria-live="polite">Caso cerrado</h2>
    <p id="dd-result"></p>
    <p id="dd-topics"></p>
    <div class="viz-row">
      <button type="button" class="btn btn-primary" id="dd-practice" hidden>Practicar los fallos</button>
      <button type="button" class="btn" id="dd-restart">Jugar desde el inicio</button>
    </div>
  </div>
  <script type="application/json" data-viz-chart id="dd-lobster">
    {"id":"dd-chart-lobster","title":"Menciones de «lobster»","description":"Datos de práctica simulados.","height":210,"columns":["año","menciones"],"rows":[[1850,1.3],[1860,1.5],[1869,1.7],[1880,3.2],[1890,3.6],[1900,3.3]],"spec":{"type":"line","x":"año","y":"menciones","xLabel":"Año","yLabel":"Menciones por millón","referenceLines":[{"axis":"x","value":1869,"label":"1869 · Ferrocarril"}]}}
  </script>
  <script type="application/json" data-viz-chart id="dd-cicada">
    {"id":"dd-chart-cicada","title":"Menciones de «cicada»","description":"Datos de práctica simulados.","height":210,"columns":["año","menciones"],"rows":[[1924,0.2],[1928,0.52],[1932,0.21],[1937,0.25],[1941,0.24],[1945,0.57],[1949,0.23],[1954,0.26],[1958,0.22],[1962,0.49],[1966,0.18]],"spec":{"type":"line","x":"año","y":"menciones","xLabel":"Año","yLabel":"Menciones por millón"}}
  </script>
</main>
<script>
(() => {
  const root = document.getElementById('detectives-de-datos');
  const ui = Object.fromEntries([...root.querySelectorAll('[id]')].map(node => [node.id.slice(3), node]));
  const challenges = [
    {
      unit: 'Pandas y limpieza', question: '¿Qué filas necesitas para responder la pregunta?',
      instruction: 'Busca los penales que no fallaron y pasaron por encima de 4 pies. Marca todas las filas que cumplen ambas condiciones.',
      table: [['Fila','Resultado','Altura (pies)'],['A','Gol',5],['B','Fallado',6],['C','Atajado',5],['D','Gol',4]],
      mode: 'multi', choices: ['Fila A','Fila B','Fila C','Fila D'], answer: [0,2],
      hint: 'Una altura exactamente igual a 4 no cuenta. Un penal atajado tampoco tiene el resultado «Fallado».',
      why: 'A y C superan los 4 pies y su resultado no es «Fallado». En pandas combinarías las dos condiciones con and dentro de query().'
    },
    {
      unit: 'Pandas y limpieza', question: '¿De dónde sale ese NaN?',
      instruction: 'Uniste todas las filas de la tabla izquierda con un catálogo. ¿Por qué falta el nombre de la especie B?',
      table: [['Código','Talla (cm)','Especie después de unir'],['A',31,'Sardina'],['B',24,'NaN']],
      choices: ['El catálogo no tiene una fila con la clave B.','La talla 24 se convirtió en texto.','La unión eliminó la fila B.'], answer: [0],
      hint: 'La fila B sigue presente. Revisa qué columna trae datos del catálogo.',
      why: 'Una unión izquierda (how="left") conserva las filas de la tabla original. Si una clave no coincide, el valor que debía venir del catálogo queda ausente.'
    },
    {
      unit: 'Pandas y limpieza', question: 'De «8.3» a un número',
      instruction: 'La columna altura contiene texto. Ordena los pasos para calcular la altura media por especie.',
      mode: 'order', code: true, choices: ["df.groupby('especie')['altura'].mean()", "df = pd.read_csv('peces.csv')", "df['altura'] = df['altura'].astype(float)"], answer: [1,2,0],
      hint: 'Primero necesitas tener el DataFrame. La media se calcula con números.',
      why: 'Carga el CSV, convierte la altura a un tipo numérico y luego agrupa por especie para calcular la media.'
    },
    {
      unit: 'Pandas y limpieza', question: '¿Qué calcula ese 75%?',
      instruction: 'En la columna germinó, 1 significa «sí» y 0 significa «no». Elige la operación que da el porcentaje de semillas que germinaron.',
      table: [['Semilla','Germinó'],[1,1],[2,1],[3,0],[4,1]],
      code: true, choices: ["df['germinó'].sum() * 100", "df['germinó'].max() * 100", "df['germinó'].mean() * 100"], answer: [2],
      hint: 'Hay tres éxitos entre cuatro semillas. Busca la operación que divide automáticamente por el total.',
      why: 'La media de una columna con unos y ceros divide la cantidad de unos entre el total. Aquí da 3 ÷ 4 × 100 = 75%.'
    },
    {
      unit: 'Visualización', question: 'Cada gráfico tiene su trabajo',
      instruction: 'Tu audiencia quiere ver cómo cambió la cantidad mensual de viajes y detectar los picos. ¿Qué gráfico elegirías?',
      choices: ['Líneas, con los meses en el eje horizontal.','Circular, con un sector por mes.','Barras con los meses ordenados por cantidad.'], answer: [0],
      hint: 'Para ver qué pasó antes y después de un pico, el orden de los meses importa.',
      why: 'Un gráfico de líneas conserva el orden temporal y hace visibles los cambios entre meses consecutivos.'
    },
    {
      unit: 'Visualización', question: 'Haz legible el gráfico de penales',
      instruction: 'Los puntos se tapan entre sí y el arco aparece aplastado. Marca los dos cambios que resuelven esos problemas.',
      mode: 'multi', choices: ['Dar algo de transparencia a los puntos.','Poner nombres más largos en los ejes.','Usar la misma escala física en X e Y.','Ordenar los datos por jugador.'], answer: [0,2],
      hint: 'Un cambio permite ver puntos superpuestos. El otro hace que un pie mida lo mismo en ambos ejes.',
      why: 'La transparencia revela dónde se acumulan los tiros. ax.set_aspect(1) conserva las proporciones del arco cuando ambos ejes usan pies.'
    },
    {
      unit: 'Modelos', question: 'El pronóstico de la bici',
      instruction: 'Un modelo ajustado entre 10 y 25 °C predice 40 viajes extra por cada grado. ¿Qué significa pasar de 18 a 20 °C?',
      choices: ['El modelo predice unos 80 viajes adicionales.','Hubo exactamente 80 viajes adicionales.','El modelo predice 40 viajes adicionales.'], answer: [0],
      hint: 'La temperatura subió dos grados. La pendiente describe el cambio por un grado.',
      why: 'La predicción aumenta 2 × 40 = 80 viajes. Es una estimación del modelo dentro del rango observado.'
    },
    {
      unit: 'Modelos', question: 'El límite del pronóstico',
      instruction: 'El modelo de viajes se entrenó con temperaturas de 10 a 25 °C y consiguió un R² de 0,96 en esos datos. ¿Qué puedes decir de una predicción a 40 °C?',
      choices: ['El 96% de los viajes a 40 °C está garantizado.','Es una extrapolación y puede fallar aunque el ajuste sea alto.','Una temperatura fuera del rango vuelve incorrectos los datos originales.'], answer: [1],
      hint: '40 °C queda por fuera de las temperaturas usadas para ajustar el modelo.',
      why: 'R² describe el ajuste en los datos evaluados. Fuera de ese rango la relación puede cambiar, por ejemplo si muy pocas personas salen en bici con calor extremo.'
    },
    {
      unit: 'Historias con datos', question: 'El ferrocarril y la langosta',
      instruction: 'Las menciones aumentan después de 1869. ¿Qué historia permite proponer la gráfica?', chart: 'lobster',
      choices: ['El ferrocarril pudo facilitar el transporte y así aumentar las menciones.','Las menciones prueban que el número de langostas aumentó.','El ferrocarril fue la única causa del aumento.'], answer: [0],
      hint: 'La línea mide palabras en publicaciones. Piensa en un mecanismo que se pueda investigar con registros de transporte.',
      why: 'El momento del aumento es compatible con la hipótesis del transporte. Para evaluarla, buscaríamos registros de envíos y compararíamos lugares con distinta conexión ferroviaria.'
    },
    {
      unit: 'Historias con datos', question: 'El código de las cigarras',
      instruction: 'Usa los tres picos más altos para estimar el intervalo que se repite.', chart: 'cicada',
      choices: ['8 años','13 años','17 años'], answer: [2],
      hint: 'Resta el año de un pico alto al del siguiente. Puedes consultar los datos debajo del gráfico.',
      why: 'Los picos altos están en 1928, 1945 y 1962. Las dos diferencias de 17 años apoyan la hipótesis de un ciclo de esa duración.'
    },
    {
      unit: 'Historias con datos', question: '¿Por qué se habla más de la anchoveta?',
      instruction: 'En años de El Niño bajan las capturas y suben las menciones de «anchoveta». Elige la explicación que encaja con ambas observaciones.',
      choices: ['El aumento de menciones demuestra que aumentó la captura.','La caída de capturas pudo generar preocupación y cobertura.','El Niño dejó de afectar los mares durante esos años.'], answer: [1],
      hint: 'Una palabra puede aparecer más porque hay un problema que la prensa empieza a cubrir.',
      why: 'Una menor captura puede atraer la atención de la prensa, incluso si se pesca menos. Las capturas también dependen del esfuerzo pesquero, por lo que conviene consultar otros datos.'
    },
    {
      unit: 'Historias con datos', question: 'Última pista: falta de sueño',
      instruction: 'Quienes duermen poco reaccionan más lento durante una semana en el laboratorio. El aburrimiento también podría influir. ¿Qué comparación ayuda a separar ambos efectos?',
      choices: ['Otra persona que duerme poco y está en su casa.','El mejor tiempo de reacción del primer día.','Un grupo que pasa la misma semana en el laboratorio y duerme normalmente.'], answer: [2],
      hint: 'Busca un grupo que comparta las condiciones del laboratorio, manteniendo una duración normal del sueño.',
      why: 'El grupo de control comparte el entorno y la duración del estudio. Compararlo con el grupo con poco sueño ayuda a estimar el efecto de la falta de sueño.'
    }
  ];

  const all = challenges.map((_, index) => index);
  const units = [...new Set(challenges.map(challenge => challenge.unit))];
  const diagrams = [
    ['Altura mayor que 4','Resultado distinto de «Fallado»','Filas A y C'],
    ['Tabla original: A y B','Catálogo: solo A','Fila B conservada con NaN'],
    ['Leer el CSV','Convertir altura a número','Agrupar y calcular la media'],
    ['3 semillas germinadas','4 semillas en total','3 ÷ 4 = 75%'],
    ['Mes en el eje X','Viajes en el eje Y','Unir en orden cronológico'],
    ['Puntos transparentes','Escala igual en X e Y','Arco con proporción correcta'],
    ['20 − 18 = 2 °C','40 viajes por °C','2 × 40 = 80 viajes'],
    ['10–25 °C: datos observados','40 °C: fuera del rango','La predicción necesita validación'],
    ['Ferrocarril en 1869','Posible aumento de envíos','Hipótesis: más menciones'],
    ['1928: primer pico','1945: 17 años después','1962: otros 17 años'],
    ['Menos capturas','Más preocupación','Posible aumento de menciones'],
    ['Misma semana y laboratorio','Un grupo duerme normalmente','Comparar tiempos de reacción']
  ];
  const initial = () => ({ version:1, deck:all.slice(), index:0, misses:[], selected:[], hint:false, solved:false });
  const storageKey = 'detectives-de-datos-juego';
  function restore(saved) {
    if (!saved || saved.version !== 1 || !Array.isArray(saved.deck) || !saved.deck.length ||
      saved.deck.some(id => !all.includes(id)) || !Number.isInteger(saved.index) ||
      saved.index < 0 || saved.index > saved.deck.length || !Array.isArray(saved.misses) ||
      saved.misses.some(id => !saved.deck.includes(id)) || !Array.isArray(saved.selected)) return initial();
    if (new Set(saved.deck).size !== saved.deck.length || new Set(saved.misses).size !== saved.misses.length) return initial();
    const q = challenges[saved.deck[saved.index]];
    if (q && (new Set(saved.selected).size !== saved.selected.length ||
      saved.selected.some(id => !Number.isInteger(id) || id < 0 || id >= q.choices.length))) return initial();
    return { ...saved, solved:Boolean(q && saved.solved) };
  }
  let game = initial();
  try { game = restore(JSON.parse(localStorage.getItem(storageKey))); } catch { /* Se puede jugar sin almacenamiento. */ }
  let chartConfig;

  function save() {
    try { localStorage.setItem(storageKey, JSON.stringify(game)); } catch { /* La partida continúa en memoria. */ }
  }

  function missedUnits() {
    return [...new Set(game.misses.map(id => challenges[id].unit))];
  }

  function setTable(target, rows, headers) {
    target.replaceChildren();
    if (!rows) return;
    const table = document.createElement('table');
    table.className = 'table table-sm';
    const head = table.createTHead().insertRow();
    headers.forEach(value => {
      const cell = document.createElement('th');
      cell.scope = 'col';
      cell.textContent = value;
      head.append(cell);
    });
    const body = table.createTBody();
    rows.forEach(row => {
      const line = body.insertRow();
      row.forEach(value => { line.insertCell().textContent = typeof value === 'number' ? value.toLocaleString('es-CO') : value; });
    });
    target.append(table);
  }

  const yearRows = config => config.rows.map(([year, value]) => [String(year), value]);
  function showEvidence(q) {
    setTable(ui.evidence, q.table?.slice(1), q.table?.[0]);
    ui.chart.hidden = !q.chart;
    if (ui.chart.dataset.chart === (q.chart ?? '')) return;
    ui.chart.dataset.chart = q.chart ?? '';
    if (!q.chart) return;
    chartConfig = JSON.parse(ui[q.chart].textContent);
    const note = document.createElement('small');
    note.textContent = chartConfig.description;
    ui['chart-title'].replaceChildren(chartConfig.title, note);
    ui.canvas.setAttribute('aria-label', `${chartConfig.spec.yLabel} por año. Consulta los valores debajo del gráfico.`);
    ui['chart-data'].open = false;
    setTable(ui['chart-data'].querySelector('div'), yearRows(chartConfig), ['Año','Menciones por millón']);
    drawChart();
  }

  function drawChart() {
    const canvas = ui.canvas;
    if (!chartConfig || !canvas.clientWidth) return;
    const { rows, spec } = chartConfig;
    const { clientWidth:width, clientHeight:height } = canvas;
    const scale = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    const left = 36, right = width - 18, top = 32, bottom = height - 35;
    const first = rows[0][0], last = rows.at(-1)[0];
    const maximum = Math.max(...rows.map(row => row[1]));
    const step = maximum > 1 ? 1 : .2;
    const limit = Math.ceil(maximum / step) * step;
    const x = year => left + (year - first) / (last - first) * (right - left);
    const y = value => bottom - value / limit * (bottom - top);
    const segment = (x1, y1, x2, y2) => {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    };
    ctx.font = '11px system-ui';
    ctx.fillStyle = '#645a70';
    ctx.fillText(spec.yLabel, 0, 13);
    ctx.textAlign = 'right';
    ctx.strokeStyle = '#e5dce9';
    for (let tick = 0; tick <= Math.round(limit / step); tick++) {
      const value = tick * step;
      segment(left, y(value), right, y(value));
      ctx.fillText(value.toLocaleString('es-CO', { maximumFractionDigits:1 }), left - 7, y(value) + 3);
    }
    ctx.textAlign = 'center';
    rows.forEach(([year], index) => {
      if (index === 0 || index === rows.length - 1 || (index % (width < 440 ? 4 : 2) === 0 && index < rows.length - 1)) {
        ctx.fillText(String(year), x(year), bottom + 16);
      }
    });
    ctx.fillText(spec.xLabel, (left + right) / 2, height - 2);
    for (const reference of spec.referenceLines ?? []) {
      ctx.strokeStyle = '#a75834'; ctx.setLineDash([4,3]);
      segment(x(reference.value), top - 3, x(reference.value), bottom);
      ctx.setLineDash([]); ctx.fillStyle = '#864027'; ctx.textAlign = 'left';
      ctx.fillText(reference.label, x(reference.value) + 4, top - 7);
    }
    ctx.strokeStyle = '#5934a4'; ctx.lineWidth = 2.6; ctx.beginPath();
    rows.forEach(([year,value], index) => index ? ctx.lineTo(x(year),y(value)) : ctx.moveTo(x(year),y(value)));
    ctx.stroke(); ctx.fillStyle = '#5934a4';
    for (const [year,value] of rows) {
      ctx.beginPath(); ctx.arc(x(year),y(value),3.2,0,Math.PI * 2); ctx.fill();
    }
  }

  function showRoute(q) {
    ui.illustration.dataset.scene = String(q ? units.indexOf(q.unit) : units.length - 1);
    const finished = game.deck.slice(0, game.index + Number(game.solved));
    ui.route.replaceChildren(...units.map(unit => {
      const topics = game.deck.filter(id => challenges[id].unit === unit);
      const completed = topics.filter(id => finished.includes(id)).length;
      const item = document.createElement('li');
      const status = document.createElement('span');
      if (q?.unit === unit) item.setAttribute('aria-current', 'step');
      if (topics.length && completed === topics.length) status.className = 'dd-done';
      status.textContent = topics.length ? `${completed}/${topics.length}` : '';
      item.append(unit, status);
      return item;
    }));
  }

  function matches(q) {
    return q.answer.length === game.selected.length && q.answer.every((choice, index) =>
      q.mode === 'order' ? choice === game.selected[index] : game.selected.includes(choice));
  }

  function updateChoices(q) {
    [...ui.choices.querySelectorAll('button')].forEach((button, index) => {
      const chosen = game.selected.includes(index);
      button.setAttribute('aria-pressed', String(chosen));
      button.querySelector('.dd-option-marker').textContent = chosen ? '✓' : String.fromCharCode(65 + index);
      button.disabled = game.solved;
    });
    ui.order.hidden = q.mode !== 'order' || game.selected.length === 0;
    const list = ui.order.querySelector('ol');
    list.replaceChildren(...game.selected.map(index => {
      const li = document.createElement('li');
      const code = document.createElement('code');
      code.textContent = q.choices[index];
      li.append(code);
      return li;
    }));
    ui.undo.hidden = ui.order.hidden || game.solved;
    ui.check.disabled = !game.selected.length || (q.mode === 'order' && game.selected.length !== q.choices.length);
  }

  function select(q, index) {
    if (game.solved) return;
    if (q.mode === 'order') {
      if (!game.selected.includes(index)) game.selected.push(index);
    } else if (q.mode === 'multi') {
      game.selected = game.selected.includes(index) ? game.selected.filter(item => item !== index) : [...game.selected, index];
    } else game.selected = [index];
    ui.feedback.textContent = '';
    updateChoices(q);
    save();
  }

  function render() {
    const solvedCount = game.index + Number(game.solved);
    const percent = 100 * solvedCount / game.deck.length;
    ui.progress.style.width = `${percent}%`;
    ui.progress.parentElement.setAttribute('aria-valuenow', String(Math.round(percent)));
    const finished = game.index === game.deck.length;
    const id = game.deck[game.index];
    const q = challenges[id];
    showRoute(q);
    ui.round.hidden = finished;
    ui.finish.hidden = !finished;
    ui.count.textContent = finished ? `${game.deck.length} retos resueltos` : `Reto ${game.index + 1} de ${game.deck.length}`;
    if (finished) {
      const points = game.deck.length - game.misses.length;
      ui.result.textContent = `Resolviste ${points} de ${game.deck.length} retos al primer intento.`;
      ui.topics.textContent = game.misses.length ? `Para reforzar: ${missedUnits().join(', ')}.` : 'Puedes repetir la partida para practicar de nuevo.';
      ui.practice.hidden = !game.misses.length;
      return;
    }
    ui.unit.textContent = q.unit;
    ui.question.textContent = q.question;
    ui.instruction.textContent = q.instruction;
    showEvidence(q);
    ui.choices.replaceChildren(...q.choices.map((choice,index) => {
      const row = document.createElement('div');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'btn';
      const marker = document.createElement('span');
      marker.className = 'dd-option-marker';
      marker.setAttribute('aria-hidden','true');
      const label = document.createElement(q.code ? 'code' : 'span');
      label.textContent = choice;
      button.append(marker,label);
      button.addEventListener('click', () => select(q,index));
      row.append(button);
      return row;
    }));
    updateChoices(q);
    ui.check.hidden = game.solved;
    ui.hint.hidden = game.solved || game.hint;
    ui.clue.hidden = game.solved || !game.hint;
    ui.clue.textContent = q.hint;
    ui.next.hidden = !game.solved;
    ui.next.textContent = game.index === game.deck.length - 1 ? 'Ver mi resultado' : 'Siguiente reto';
    ui.feedback.replaceChildren();
    ui.explanation.hidden = !game.solved;
    if (game.solved) {
      const heading = document.createElement('strong');
      heading.textContent = '¡Correcto! ';
      ui.feedback.append(heading,q.why);
      ui.explanation.querySelector('ol').replaceChildren(...diagrams[id].map(step => {
        const item = document.createElement('li');
        item.textContent = step;
        return item;
      }));
    }
  }

  ui.hint.addEventListener('click', () => {
    game.hint = true;
    ui.clue.hidden = false;
    ui.hint.hidden = true;
    ui.choices.querySelector('button').focus();
    save();
  });
  ui.undo.addEventListener('click', () => {
    const index = game.selected.pop();
    ui.feedback.textContent = '';
    updateChoices(challenges[game.deck[game.index]]);
    ui.choices.querySelectorAll('button')[index]?.focus();
    save();
  });
  ui.check.addEventListener('click', () => {
    const id = game.deck[game.index];
    const q = challenges[id];
    if (game.solved || ui.check.disabled) return;
    if (matches(q)) {
      game.solved = true;
      render();
      ui.next.focus();
    } else {
      if (!game.misses.includes(id)) game.misses.push(id);
      ui.feedback.textContent = 'Todavía no coincide. ' + q.hint;
      if (q.mode === 'order') {
        game.selected = [];
        updateChoices(q);
        ui.choices.querySelector('button').focus();
      }
    }
    save();
  });
  ui.next.addEventListener('click', () => {
    game.index++;
    Object.assign(game, { selected:[], hint:false, solved:false });
    render();
    (ui.round.hidden ? (ui.practice.hidden ? ui.restart : ui.practice) : ui.question).focus();
    save();
  });
  function start(deck) {
    game = { ...initial(), deck };
    render();
    ui.question.focus();
    save();
  }
  ui.practice.addEventListener('click', () => start(game.misses.slice()));
  ui.restart.addEventListener('click', () => start(all.slice()));
  new ResizeObserver(drawChart).observe(ui.canvas);
  render();
})();
</script>
</body>
</html>
